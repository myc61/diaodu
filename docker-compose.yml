name: dispatcher

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dispatcher}
      POSTGRES_USER: ${POSTGRES_USER:-dispatcher}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dispatcher_dev_password}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  dispatcher:
    build:
      context: .
      dockerfile: deploy/backend/Dockerfile
      args:
        DROGON_VERSION: v1.9.13
    environment:
      DISPATCHER_HTTP_PORT: 8080
      DISPATCHER_DATABASE_URL: postgresql://${POSTGRES_USER:-dispatcher}:${POSTGRES_PASSWORD:-dispatcher_dev_password}@postgres:5432/${POSTGRES_DB:-dispatcher}
      DISPATCHER_PROFILE_PATH: /etc/dispatcher/profile.yaml
      DISPATCHER_SSH_SECRET_ROOTS: ${DISPATCHER_SSH_SECRET_ROOTS:-/run/secrets:/etc/dispatcher/ssh}
    volumes:
      - map-data:/var/lib/dispatcher/maps
      - ./config/deployment-profiles/standard_dispatch.yaml:/etc/dispatcher/profile.yaml:ro
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: deploy/frontend/Dockerfile
    ports:
      - "${WEB_PORT:-8088}:80"
    depends_on:
      dispatcher:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
  map-data:
